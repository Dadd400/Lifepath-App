<title>Career Path Quiz · LifePath</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F9F8F5;--surface:#F2EFE9;--card:#FFFFFF;--border:#E2DDD6;
  --ink:#1C1C1C;--inkMid:#6B6560;--inkDim:#B8B4AC;
  --accent:#1C3D6B;--accentL:#2E5FA3;--accentBg:rgba(28,61,107,0.06);
  --gold:#C4873A;--green:#2A7A52;--coral:#C44A3A;--purple:#6B3A8A;--teal:#2A7A8A;
  --ff:'DM Serif Display',Georgia,serif;
  --sans:'Plus Jakarta Sans',sans-serif;
  --mono:'Fira Code',monospace;
}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:10px}
.nav-logo{font-family:var(--ff);font-size:18px;color:var(--ink);text-decoration:none}
.nav-back{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--accentL);text-decoration:none;letter-spacing:0.05em}

/* INTRO */
.intro{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:80px 0 60px}
.intro-eye{font-size:10px;font-family:var(--mono);color:var(--accentL);letter-spacing:0.3em;margin-bottom:20px}
.intro-h1{font-family:var(--ff);font-size:clamp(44px,9vw,72px);font-weight:400;color:var(--ink);line-height:1;letter-spacing:-0.025em;margin-bottom:6px}
.intro-bar{width:60px;height:3px;background:var(--accent);border-radius:2px;margin:20px 0 24px}
.intro-p{font-size:16px;color:var(--inkMid);line-height:1.8;max-width:460px;margin-bottom:32px}
.tag-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:36px}
.tag{font-size:11px;font-family:var(--mono);color:var(--inkMid);border:1px solid var(--border);padding:5px 12px;border-radius:20px}
.btn-start{background:var(--ink);color:#fff;border:none;padding:15px 36px;border-radius:30px;font-size:14px;font-family:var(--mono);font-weight:700;cursor:pointer;letter-spacing:0.06em}
.intro-note{margin-top:14px;font-size:11px;color:var(--inkDim);font-family:var(--mono)}

/* PROGRESS */
.progress-wrap{margin-bottom:28px}
.progress-meta{display:flex;justify-content:space-between;margin-bottom:8px}
.progress-cat{font-size:10px;font-family:var(--mono);color:var(--inkMid);letter-spacing:0.2em}
.progress-num{font-size:10px;font-family:var(--mono);color:var(--inkDim)}
.progress-bar{display:flex;gap:3px}
.progress-seg{height:3px;border-radius:2px;background:var(--border);transition:all 0.3s ease}
.progress-seg.done{background:var(--accent)}
.progress-seg.active{flex:3;background:var(--accent)}

/* QUIZ */
.quiz-wrap{padding-top:80px;padding-bottom:120px}
.q-dot-row{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.q-dot{width:6px;height:6px;border-radius:50%;background:var(--ink)}
.q-label{font-size:10px;font-family:var(--mono);color:var(--inkMid);letter-spacing:0.12em}
.q-text{font-family:var(--ff);font-size:clamp(20px,4vw,28px);font-weight:400;color:var(--ink);margin-bottom:6px;line-height:1.3;letter-spacing:-0.015em}
.q-instr{font-size:11px;color:var(--inkDim);font-family:var(--mono);margin-bottom:20px;letter-spacing:0.05em}
.q-sel-count{color:var(--gold)}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:28px}
.opt{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:13px 16px;cursor:pointer;text-align:left;width:100%;transition:all 0.15s;font-family:var(--sans)}
.opt:hover{border-color:var(--accent);background:var(--accentBg)}
.opt.selected{background:var(--accentBg);border-color:var(--accent)}
.opt-icon{font-size:20px;width:26px;text-align:center;flex-shrink:0}
.opt-label{font-size:14px;color:var(--ink);flex:1;line-height:1.4;font-weight:400}
.opt.selected .opt-label{color:var(--accentL);font-weight:500}
.opt-check{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;transition:all 0.15s}
.opt-check.multi{border-radius:4px}
.opt.selected .opt-check{background:var(--accent);border-color:var(--accent)}
.opt.disabled{opacity:0.35;cursor:not-allowed}
.opt.disabled:hover{border-color:var(--border);background:var(--card)}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(249,248,245,0.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:14px 20px 24px;display:flex;justify-content:space-between;align-items:center;z-index:50}
.btn-back{background:none;border:1px solid var(--border);color:var(--inkMid);font-family:var(--mono);font-size:12px;cursor:pointer;padding:9px 18px;border-radius:20px}
.btn-back.hidden{opacity:0;pointer-events:none}
.nav-sel{font-size:11px;color:var(--inkDim);font-family:var(--mono)}
.btn-next{background:var(--ink);border:none;color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;font-family:var(--mono);font-weight:700;cursor:pointer;letter-spacing:0.06em;transition:all 0.15s}
.btn-next.disabled{background:var(--border);color:var(--inkMid);cursor:default}

/* RESULTS */
.results-wrap{padding-top:80px;padding-bottom:60px}
.results-eye{font-size:10px;font-family:var(--mono);color:var(--accentL);letter-spacing:0.3em;margin-bottom:12px}
.results-h{font-family:var(--ff);font-size:clamp(32px,6vw,52px);font-weight:400;color:var(--ink);margin-bottom:12px;letter-spacing:-0.025em;line-height:1}
.results-sub{font-size:14px;color:var(--inkMid);line-height:1.7;margin-bottom:32px}

/* RESULT CARD */
.r-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:12px;transition:all 0.2s}
.r-card.open{box-shadow:0 8px 32px rgba(0,0,0,0.06)}
.r-header{width:100%;background:none;border:none;cursor:pointer;padding:20px 24px;text-align:left;display:flex;align-items:center;gap:14px}
.r-icon{width:50px;height:50px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px}
.r-info{flex:1}
.r-badges{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.r-badge{font-size:9px;font-family:var(--mono);font-weight:700;letter-spacing:0.12em;padding:2px 8px;border-radius:10px}
.r-title{font-size:17px;font-weight:600;color:var(--ink);font-family:var(--sans)}
.r-hl{font-size:12px;color:var(--inkMid);font-family:var(--mono);margin-top:2px}
.r-score-wrap{text-align:right;flex-shrink:0}
.r-score{font-size:28px;font-weight:700;font-family:var(--mono);line-height:1}
.r-score-lbl{font-size:9px;color:var(--inkDim);font-family:var(--mono)}
.r-toggle{color:var(--inkDim);font-size:12px;margin-left:4px}

.r-body{padding:4px 24px 28px;border-top:1px solid var(--border)}
.r-summary{font-size:14px;color:var(--inkMid);line-height:1.8;margin:18px 0 20px;border-left:3px solid;padding-left:14px}
.section-lbl{font-size:9px;font-family:var(--mono);letter-spacing:0.18em;color:var(--inkDim);margin-bottom:10px;text-transform:uppercase}
.scores-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;background:var(--surface);border-radius:10px;padding:16px;margin-bottom:20px}
.score-row{display:flex;justify-content:space-between;align-items:center}
.score-lbl{font-size:11px;color:var(--inkMid);font-family:var(--mono)}
.score-dots{display:flex;gap:3px}
.score-dot{width:8px;height:8px;border-radius:50%}
.entry-row{padding:12px 14px;border-radius:8px;margin-bottom:4px}
.entry-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.entry-title{font-size:14px;color:var(--ink);font-weight:500}
.entry-sal{font-size:12px;font-weight:700;font-family:var(--mono)}
.entry-time{font-size:11px;color:var(--inkMid);font-family:var(--mono);margin-top:3px}
.industry-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.ind-tag{font-size:11px;font-family:var(--mono);padding:4px 10px;border-radius:16px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.info-box{background:var(--surface);border-radius:10px;padding:12px 14px}
.info-box-lbl{font-size:9px;font-family:var(--mono);letter-spacing:0.12em;color:var(--inkDim);margin-bottom:5px;text-transform:uppercase}
.info-box-val{font-size:12px;color:var(--inkMid);line-height:1.5}
.watch-box{border-radius:10px;padding:12px 16px}
.watch-kw{font-size:10px;font-family:var(--mono);font-weight:700;letter-spacing:0.12em}
.watch-txt{font-size:13px;color:var(--inkMid);line-height:1.6}

/* OTHERS */
.others-lbl{font-size:10px;font-family:var(--mono);letter-spacing:0.2em;color:var(--inkDim);margin-bottom:12px;text-transform:uppercase}
.others-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px}
.other-chip{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px}
.other-name{font-size:13px;color:var(--ink);font-weight:500}
.other-pct{font-size:10px;font-family:var(--mono);color:var(--inkDim)}
.btn-retake{background:none;border:1px solid var(--border);color:var(--inkMid);font-size:12px;font-family:var(--mono);cursor:pointer;padding:10px 24px;border-radius:20px;letter-spacing:0.08em}
</style>
</head>

// ── STATE ─────────────────────────────────────────────────────────────────────
let phase = 'intro'; // intro | quiz | results
let qIdx = 0;
let answers = Array.from({length: QUESTIONS.length}, () => []);
let results = null;
let openCard = 0;

// ── SCORING ──────────────────────────────────────────────────────────────────
function score() {
  const tagCounts = {};
  const avoidTags = [];
  answers.forEach((sel, qi) => {
    const q = QUESTIONS[qi];
    sel.forEach(oi => {
      (q.opts[oi].t || []).forEach(tag => {
        if (tag.startsWith('avoid_')) avoidTags.push(tag);
        else tagCounts[tag] = (tagCounts[tag]||0) + 1;
      });
    });
  });
  return PROFILES.map(p => {
    let s = 0;
    p.tags.forEach(tag => { s += (tagCounts[tag]||0) * 2; });
    if (avoidTags.includes('avoid_desk') && ['finance','consulting'].includes(p.id)) s -= 4;
    if (avoidTags.includes('avoid_physical') && p.id === 'trades') s -= 6;
    if (avoidTags.includes('avoid_degree') && ['law','healthcare'].includes(p.id)) s -= 4;
    if (avoidTags.includes('avoid_inperson') && ['trades','healthcare'].includes(p.id)) s -= 3;
    if (avoidTags.includes('avoid_unstable') && ['entrepreneur','creative'].includes(p.id)) s -= 4;
    if (avoidTags.includes('avoid_routine') && ['ops','finance'].includes(p.id)) s -= 2;
    const max = p.tags.length * 2 * 3;
    return {...p, pct: Math.min(Math.max(Math.round((s/max)*100), 22), 97)};
  }).sort((a,b) => b.pct - a.pct);
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function dots(val, color) {
  return Array.from({length:5}, (_,i) =>
    `<div class="score-dot" style="background:${i < val ? color : 'var(--border)'}"></div>`
  ).join('');
}

function renderIntro() {
  return `
    <div class="intro">
      <div class="intro-eye">LIFEPATH · CAREER QUIZ</div>
      <h1 class="intro-h1">What career<br>were you<br>built for?</h1>
      <div class="intro-bar"></div>
      <p class="intro-p">14 questions. Every age, every background, every starting point. Your results include specific roles, entry paths, salary ranges, and remote work options.</p>
      <div class="tag-row">
        <span class="tag">High school students</span>
        <span class="tag">College students</span>
        <span class="tag">Career changers</span>
        <span class="tag">Working professionals</span>
      </div>
      <button class="btn-start" onclick="startQuiz()">BEGIN THE QUIZ →</button>
      <div class="intro-note">14 questions · ~5 minutes · Free</div>
    </div>`;
}

function renderProgress() {
  const q = QUESTIONS[qIdx];
  const segs = QUESTIONS.map((_,i) => {
    const cls = i < qIdx ? 'done' : i === qIdx ? 'active' : '';
    return `<div class="progress-seg ${cls}" style="flex:${i===qIdx?3:1}"></div>`;
  }).join('');
  return `<div class="progress-wrap">
    <div class="progress-meta">
      <span class="progress-cat">${q.cat.toUpperCase()}</span>
      <span class="progress-num">${q.num} / ${QUESTIONS.length}</span>
    </div>
    <div class="progress-bar">${segs}</div>
  </div>`;
}

function renderQuiz() {
  const q = QUESTIONS[qIdx];
  const sel = answers[qIdx];
  const isMulti = q.type === 'multi';
  const max = q.max || 99;
  const optHtml = q.opts.map((opt, i) => {
    const isOn = sel.includes(i);
    const isDisabled = isMulti && !isOn && sel.length >= max;
    const checkCls = isMulti ? 'multi' : '';
    return `<button class="opt ${isOn?'selected':''} ${isDisabled?'disabled':''}" onclick="toggleOpt(${i})" ${isDisabled?'disabled':''}>
      <span class="opt-icon">${opt.i}</span>
      <span class="opt-label">${opt.l}</span>
      <div class="opt-check ${checkCls}">${isOn?'✓':''}</div>
    </button>`;
  }).join('');
  const instrText = isMulti
    ? `${q.type === 'multi' ? 'Select up to' : 'Choose one'} ${max} <span class="q-sel-count">· ${sel.length}/${max} selected</span>`
    : 'Choose one';
  return `
    <div class="quiz-wrap">
      ${renderProgress()}
      <div class="q-dot-row"><div class="q-dot"></div><span class="q-label">QUESTION ${q.num} OF ${QUESTIONS.length}</span></div>
      <h2 class="q-text">${q.q}</h2>
      <p class="q-instr">${instrText}</p>
      <div class="opts">${optHtml}</div>
    </div>
    <div class="bottom-nav">
      <button class="btn-back ${qIdx===0?'hidden':''}" onclick="goBack()">← Back</button>
      <span class="nav-sel">${sel.length > 0 ? sel.length + ' selected' : 'select to continue'}</span>
      <button class="btn-next ${sel.length===0?'disabled':''}" onclick="goNext()" ${sel.length===0?'disabled':''}>
        ${qIdx+1 === QUESTIONS.length ? 'SEE RESULTS →' : 'NEXT →'}
      </button>
    </div>`;
}

function renderCard(p, rank) {
  const isOpen = openCard === rank;
  const medals = ['🎯','✅','📋'];
  const entriesHtml = p.entries.map((e,i) => `
    <div class="entry-row" style="background:${i%2===0?'var(--surface)':'transparent'}">
      <div class="entry-top">
        <span class="entry-title">${e.t}</span>
        <span class="entry-sal" style="color:${p.accent}">${e.sal}</span>
      </div>
      <div class="entry-time">${e.time}</div>
    </div>`).join('');
  const indsHtml = p.inds.map(ind =>
    `<span class="ind-tag" style="color:${p.accent};border:1px solid ${p.color}30">${ind}</span>`
  ).join('');
  return `
    <div class="r-card ${isOpen?'open':''}" style="border-color:${isOpen?p.color+'70':'var(--border)'}">
      <button class="r-header" onclick="toggleCard(${rank})">
        <div class="r-icon" style="background:${p.accentBg};border:1px solid ${p.color}30">${p.icon}</div>
        <div class="r-info">
          <div class="r-badges">
            ${rank < 3 ? `<span style="font-size:14px">${medals[rank]}</span>` : ''}
            ${rank === 0 ? `<span class="r-badge" style="color:${p.accent};border:1px solid ${p.accent}">BEST FIT</span>` : ''}
          </div>
          <div class="r-title">${p.title}</div>
          <div class="r-hl">${p.hl}</div>
        </div>
        <div class="r-score-wrap">
          <div class="r-score" style="color:${p.accent}">${p.pct}%</div>
          <div class="r-score-lbl">match</div>
        </div>
        <span class="r-toggle">${isOpen?'▲':'▼'}</span>
      </button>
      ${isOpen ? `
      <div class="r-body">
        <p class="r-summary" style="border-color:${p.color}">${p.summary}</p>
        <div class="section-lbl">At a glance</div>
        <div class="scores-grid">
          ${[['Remote Friendly',p.rem],['Income Potential',p.inc],['Job Stability',p.stab]].map(([lbl,val]) => `
            <div class="score-row">
              <span class="score-lbl">${lbl}</span>
              <div class="score-dots">${dots(val, p.accent)}</div>
            </div>`).join('')}
        </div>
        <div class="section-lbl">Ways In</div>
        ${entriesHtml}
        <div style="height:16px"></div>
        <div class="section-lbl">Industries to Target</div>
        <div class="industry-tags">${indsHtml}</div>
        <div class="two-col">
          <div class="info-box">
            <div class="info-box-lbl">🌐 Remote Work</div>
            <div class="info-box-val">${p.remote}</div>
          </div>
          <div class="info-box">
            <div class="info-box-lbl">🎯 Fast Entry Path</div>
            <div class="info-box-val">${p.cert}</div>
          </div>
        </div>
        <div class="watch-box" style="background:${p.accentBg};border:1px solid ${p.color}22">
          <span class="watch-kw" style="color:${p.accent}">WATCH OUT  </span>
          <span class="watch-txt">${p.watch}</span>
        </div>
      </div>` : ''}
    </div>`;
}

function renderResults() {
  const top3 = results.slice(0,3);
  const others = results.slice(3,7);
  const othersHtml = others.map(p => `
    <div class="other-chip">
      <span style="font-size:16px">${p.icon}</span>
      <div>
        <div class="other-name">${p.title}</div>
        <div class="other-pct">${p.pct}% match</div>
      </div>
    </div>`).join('');
  return `
    <div class="results-wrap">
      <div class="results-eye">YOUR RESULTS</div>
      <h2 class="results-h">Your career matches</h2>
      <p class="results-sub">Ranked by how well each field matches your strengths, interests, and preferences. Tap any card to see the full breakdown.</p>
      ${top3.map((p,i) => renderCard(p,i)).join('')}
      <div class="others-lbl">Also worth exploring</div>
      <div class="others-grid">${othersHtml}</div>
      <button class="btn-retake" onclick="restart()">↩ Retake Quiz</button>
    </div>`;
}

function render() {
  const app = document.getElementById('app');
  if (phase === 'intro') app.innerHTML = renderIntro();
  else if (phase === 'quiz') app.innerHTML = renderQuiz();
  else app.innerHTML = renderResults();
  window.scrollTo(0, 0);
}

// ── ACTIONS ──────────────────────────────────────────────────────────────────
function startQuiz() { phase = 'quiz'; qIdx = 0; render(); }
function goBack() { if (qIdx > 0) { qIdx--; render(); } }
function goNext() {
  const sel = answers[qIdx];
  if (sel.length === 0) return;
  if (qIdx + 1 >= QUESTIONS.length) {
    results = score();
    phase = 'results';
  } else { qIdx++; }
  render();
}
function toggleOpt(i) {
  const q = QUESTIONS[qIdx];
  const sel = answers[qIdx];
  const isMulti = q.type === 'multi';
  if (!isMulti) { answers[qIdx] = sel.includes(i) ? [] : [i]; }
  else {
    if (sel.includes(i)) answers[qIdx] = sel.filter(x => x !== i);
    else if (sel.length < (q.max||99)) answers[qIdx] = [...sel, i];
  }
  render();
}
function toggleCard(rank) { openCard = openCard === rank ? -1 : rank; render(); }
function restart() {
  phase = 'intro'; qIdx = 0; openCard = 0;
  answers = Array.from({length: QUESTIONS.length}, () => []);
  results = null;
  render();
}

render();
</script>
