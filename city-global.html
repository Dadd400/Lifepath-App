<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Global City Finder · LifePath</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Outfit:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060C14;--surface:#0E1520;--card:#131D2A;--border:#182030;--borderB:#263040;
  --text:#E8EEF4;--textM:#5A7080;--textD:#1A2A3A;
  --accent:#5AAFD4;--accentD:#3A8FB4;--accentBg:rgba(90,175,212,0.08);
  --gold:#D4A843;--green:#4CAF82;--coral:#E87A6F;
  --ff:'Abril Fatface',Georgia,serif;
  --sans:'Outfit',sans-serif;
  --mono:'Space Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}
.wrap{max-width:680px;margin:0 auto;padding:0 20px}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:10px}
.nav-logo{font-size:16px;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px}
.nav-back{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--accent);text-decoration:none}
.intro{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:80px 0 60px}
.intro-eye{font-size:10px;font-family:var(--mono);color:var(--accent);letter-spacing:0.3em;margin-bottom:16px;text-transform:uppercase}
.intro-h{font-family:var(--ff);font-size:clamp(48px,10vw,80px);color:var(--text);line-height:0.95;letter-spacing:-0.02em;margin-bottom:4px}
.intro-h span{color:var(--accent)}
.intro-p{font-size:16px;color:var(--textM);line-height:1.8;max-width:480px;margin:24px 0 28px}
.factor-pills{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:40px}
.factor-pill{font-size:11px;font-family:var(--mono);color:var(--textM);border:1px solid var(--border);padding:5px 12px;border-radius:20px}
.btn-start{background:var(--accent);color:var(--bg);border:none;padding:15px 40px;border-radius:30px;font-size:14px;font-family:var(--mono);font-weight:700;cursor:pointer;letter-spacing:0.08em;box-shadow:0 8px 32px rgba(90,175,212,0.4)}
.intro-note{margin-top:14px;font-size:11px;color:var(--textD);font-family:var(--mono)}
.progress-wrap{margin-bottom:24px}
.progress-meta{display:flex;justify-content:space-between;margin-bottom:8px}
.progress-cat{font-size:10px;font-family:var(--mono);color:var(--accent);letter-spacing:0.2em;text-transform:uppercase}
.progress-num{font-size:10px;font-family:var(--mono);color:var(--textD)}
.progress-bar{display:flex;gap:3px}
.progress-seg{height:2px;border-radius:1px;background:var(--border);transition:all 0.3s}
.progress-seg.done,.progress-seg.active{background:var(--accent)}
.progress-seg.active{flex:4}
.quiz-wrap{padding-top:80px;padding-bottom:120px}
.q-meta{display:flex;justify-content:space-between;margin-bottom:12px}
.q-cat{font-size:10px;font-family:var(--mono);color:var(--accent);letter-spacing:0.2em;text-transform:uppercase}
.q-num{font-size:10px;font-family:var(--mono);color:var(--textD)}
.q-text{font-family:var(--ff);font-size:clamp(20px,4vw,28px);color:var(--text);margin-bottom:6px;line-height:1.2}
.q-instr{font-size:11px;color:var(--textD);font-family:var(--mono);margin-bottom:20px}
.q-sel{color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:28px}
.opt{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 16px;cursor:pointer;text-align:left;width:100%;transition:all 0.15s;font-family:var(--sans)}
.opt:hover{border-color:var(--borderB)}
.opt.selected{background:var(--accentBg);border-color:rgba(90,175,212,0.5)}
.opt-icon{font-size:20px;width:26px;text-align:center;flex-shrink:0}
.opt-label{font-size:14px;color:var(--text);flex:1;line-height:1.4}
.opt-sub{font-size:11px;color:var(--textM);margin-top:2px}
.opt.selected .opt-label{color:var(--accent)}
.opt-check{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--bg);transition:all 0.15s}
.opt-check.multi{border-radius:4px}
.opt.selected .opt-check{background:var(--accent);border-color:var(--accent)}
.opt.disabled{opacity:0.35;cursor:not-allowed}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(6,12,20,0.95);backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:14px 20px 24px;display:flex;justify-content:space-between;align-items:center;z-index:50}
.btn-back{background:none;border:1px solid var(--border);color:var(--textM);font-family:var(--mono);font-size:12px;cursor:pointer;padding:9px 18px;border-radius:20px}
.btn-back.hidden{opacity:0;pointer-events:none}
.nav-sel{font-size:11px;color:var(--textD);font-family:var(--mono)}
.btn-next{background:var(--accent);border:none;color:var(--bg);padding:10px 24px;border-radius:20px;font-size:13px;font-family:var(--mono);font-weight:700;cursor:pointer;letter-spacing:0.06em}
.btn-next.disabled{background:var(--border);color:var(--textD);cursor:default}
.results-wrap{padding-top:80px;padding-bottom:60px}
.results-eye{font-size:10px;font-family:var(--mono);color:var(--accent);letter-spacing:0.3em;margin-bottom:12px;text-transform:uppercase}
.results-h{font-family:var(--ff);font-size:clamp(36px,7vw,56px);color:var(--text);margin-bottom:14px;line-height:1}
.results-sub{font-size:14px;color:var(--textM);line-height:1.7;margin-bottom:28px}
.r-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:10px;transition:all 0.25s}
.r-header{width:100%;background:none;border:none;cursor:pointer;padding:18px 22px;text-align:left;display:flex;align-items:center;gap:14px;font-family:var(--sans)}
.r-emoji-wrap{width:52px;height:52px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:26px}
.r-info{flex:1;min-width:0}
.r-flag{font-size:17px;font-weight:600;color:var(--text);margin-bottom:2px}
.r-tag{font-size:11px;color:var(--textM);font-family:var(--mono)}
.r-vibes{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.r-vibe{font-size:9px;font-family:var(--mono);border-radius:8px;padding:2px 7px;letter-spacing:0.08em}
.r-score-wrap{text-align:right;flex-shrink:0}
.r-score{font-size:28px;font-weight:700;font-family:var(--mono);line-height:1}
.r-score-lbl{font-size:9px;color:var(--textD);font-family:var(--mono)}
.r-toggle{color:var(--textD);font-size:12px;margin-left:4px}
.r-body{padding:4px 22px 24px;border-top:1px solid var(--border)}
.section-lbl{font-size:9px;font-family:var(--mono);letter-spacing:0.15em;color:var(--textD);margin-bottom:10px;text-transform:uppercase}
.scores-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;background:var(--surface);border-radius:10px;padding:16px;margin-bottom:20px}
.score-row{display:flex;justify-content:space-between;align-items:center}
.score-lbl{font-size:11px;color:var(--textM);font-family:var(--mono)}
.score-dots{display:flex;gap:3px}
.score-dot{width:8px;height:8px;border-radius:50%}
.highlights-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.hl-row{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.hl-text{font-size:12px;color:var(--textM);line-height:1.5}
.hl-col-title{font-size:9px;font-family:var(--mono);letter-spacing:0.15em;color:var(--textD);margin-bottom:10px;text-transform:uppercase}
.info-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.info-box{background:var(--surface);border-radius:10px;padding:12px 14px}
.info-lbl{font-size:9px;font-family:var(--mono);letter-spacing:0.12em;color:var(--textD);margin-bottom:5px;text-transform:uppercase}
.info-val{font-size:12px;color:var(--textM);line-height:1.5}
.black-box{border-radius:10px;padding:12px 16px;margin-bottom:14px}
.nbhd-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.nbhd-tag{font-size:11px;font-family:var(--mono);padding:4px 11px;border-radius:20px}
.others-lbl{font-size:9px;font-family:var(--mono);letter-spacing:0.2em;color:var(--textD);margin-bottom:10px;text-transform:uppercase}
.others-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px}
.other-chip{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px}
.other-name{font-size:13px;color:var(--text);font-weight:500}
.other-pct{font-size:10px;font-family:var(--mono);color:var(--textD)}
.btn-retake{background:none;border:1px solid var(--border);color:var(--textM);font-size:12px;font-family:var(--mono);cursor:pointer;padding:10px 24px;border-radius:20px;letter-spacing:0.08em}
</style>
</head>

function computeResults(allAnswers){
  const tagCounts={};const avoidTags=[];
  allAnswers.forEach((sel,qi)=>{
    const q=QUESTIONS[qi];
    sel.forEach(oi=>{
      (q.opts[oi].t||[]).forEach(tag=>{
        if(tag.startsWith('avoid_'))avoidTags.push(tag);
        else tagCounts[tag]=(tagCounts[tag]||0)+1;
      });
    });
  });
  return CITIES.map(city=>{
    const sc=city.scores;let s=0;
    const weights=[['black_large',sc.black_large,4],['black_culture',sc.black_culture,3],['diaspora',sc.diaspora,3],['africa',sc.africa_close,3],['diverse',sc.diverse,2],['walkable',sc.walkable,3],['transit',sc.transit,2],['warm',sc.warm,3],['mild',sc.mild,2],['outdoor',sc.outdoor,2],['beach',sc.beach,3],['nightlife',sc.nightlife,2],['food',sc.food,2],['arts',sc.arts,2],['jobs_strong',sc.jobs_strong,3],['jobs_ops',sc.jobs_ops,2],['expat',sc.expat,2],['english_ok',sc.english_ok,3],['english_must',sc.english_ok,4],['english_pref',sc.english_ok,2],['visa_easy',sc.visa_easy,3],['visa_pr',sc.visa_pr,3],['visa_nomad',sc.visa_nomad,2],['remote',sc.visa_easy,1],['healthcare_high',sc.healthcare,3],['healthcare_mid',sc.healthcare,2],['safety_high',sc.safety,4],['safety_mid',sc.safety,2],['airport',sc.airport,2],['fast',sc.fast,2],['balanced',sc.balanced,2],['slow',sc.slow,2],['cost_high',sc.cost,4],['cost_mid',sc.cost,3],['cost_low',sc.cost,2],['cost_bonus',sc.cost,1]];
    weights.forEach(([tag,val,mult])=>{if(tagCounts[tag])s+=val*(tagCounts[tag])*mult;});
    if(avoidTags.includes('avoid_expensive')&&sc.cost<=2)s-=20;
    if(avoidTags.includes('avoid_cold')&&sc.warm<=2)s-=20;
    if(avoidTags.includes('avoid_no_black')&&sc.black_large<=2)s-=25;
    if(avoidTags.includes('avoid_no_english')&&sc.english_ok<=2)s-=20;
    if(avoidTags.includes('avoid_hard_visa')&&sc.visa_easy<=2)s-=20;
    if(avoidTags.includes('avoid_no_health')&&sc.healthcare<=2)s-=20;
    if(avoidTags.includes('avoid_unsafe')&&sc.safety<=2)s-=25;
    if(avoidTags.includes('avoid_no_transit')&&sc.transit<=2)s-=15;
    return{...city,pct:Math.min(Math.max(Math.round((s/400)*100),18),97)};
  }).sort((a,b)=>b.pct-a.pct);
}

function dots(val,color){
  return Array.from({length:5},(_,i)=>`<div class="score-dot" style="background:${i<val?color:'var(--border)'}"></div>`).join('');
}

function renderProgress(){
  const q=QUESTIONS[qIdx];
  const segs=QUESTIONS.map((_,i)=>{
    const cls=i<qIdx?'done':i===qIdx?'active':'';
    return`<div class="progress-seg ${cls}" style="flex:${i===qIdx?4:1}"></div>`;
  }).join('');
  return`<div class="progress-wrap">
    <div class="progress-meta"><span class="progress-cat">${q.cat.toUpperCase()}</span><span class="progress-num">${q.num} / ${QUESTIONS.length}</span></div>
    <div class="progress-bar">${segs}</div>
  </div>`;
}

function renderQuiz(){
  const q=QUESTIONS[qIdx];const sel=answers[qIdx];const isMulti=q.type==='multi';const max=q.max||99;
  const instrText=isMulti?`Select up to ${max} <span class="q-sel">· ${sel.length}/${max} selected</span>`:'Choose one';
  const optHtml=q.opts.map((opt,i)=>{
    const isOn=sel.includes(i);const isDisabled=isMulti&&!isOn&&sel.length>=max;
    return`<button class="opt ${isOn?'selected':''} ${isDisabled?'disabled':''}" onclick="toggleOpt(${i})" ${isDisabled?'disabled':''}>
      <span class="opt-icon">${opt.i}</span>
      <div style="flex:1">
        <div class="opt-label">${opt.l}</div>
        ${opt.sub?`<div class="opt-sub">${opt.sub}</div>`:''}
      </div>
      <div class="opt-check ${isMulti?'multi':''}">${isOn?'✓':''}</div></button>`;
  }).join('');
  return`<div class="quiz-wrap">
    ${renderProgress()}
    <div class="q-meta"><span class="q-cat">${q.cat.toUpperCase()}</span><span class="q-num">Q${q.num}</span></div>
    <h2 class="q-text">${q.q}</h2>
    <p class="q-instr">${instrText}</p>
    <div class="opts">${optHtml}</div>
  </div>
  <div class="bottom-nav">
    <button class="btn-back ${qIdx===0?'hidden':''}" onclick="goBack()">← Back</button>
    <span class="nav-sel">${sel.length>0?sel.length+' selected':'select to continue'}</span>
    <button class="btn-next ${sel.length===0?'disabled':''}" onclick="goNext()" ${sel.length===0?'disabled':''}>${qIdx+1===QUESTIONS.length?'SEE MY CITIES →':'NEXT →'}</button>
  </div>`;
}

      <div class="black-box" style="background:${city.colorBg};border:1px solid ${city.color}20">
        <span style="font-size:10px;font-family:var(--mono);color:${city.color};font-weight:700;letter-spacing:0.12em">BLACK COMMUNITY  </span>
        <span style="font-size:13px;color:var(--textM)">${city.blackPop}</span>
      </div>
      <div class="section-lbl">Neighborhoods to explore</div>
      <div class="nbhd-tags">${city.nbhds.map(n=>`<span class="nbhd-tag" style="color:${city.color};border:1px solid ${city.color}30">${n}</span>`).join('')}</div>
    </div>`:''}
  </div>`;
}

function renderResults(){
  const top4=results.slice(0,4);const others=results.slice(4,9);
  return`<div class="results-wrap">
    <div class="results-eye">YOUR RESULTS</div>
    <h2 class="results-h">Your global cities.</h2>
    <p class="results-sub">Ranked by how well each city matches everything you told us. Tap any city to expand the full breakdown.</p>
    ${top4.map((c,i)=>renderCard(c,i)).join('')}
    <div class="others-lbl" style="margin-top:24px">Also worth a look</div>
    <div class="others-grid">${others.map(c=>`<div class="other-chip"><span style="font-size:20px">${c.flag}</span><div><div class="other-name">${c.name}</div><div class="other-pct">${c.pct}% match</div></div></div>`).join('')}</div>
    <button class="btn-retake" onclick="restart()">↩ Start Over</button>
  </div>`;
}

function render(){
  const app=document.getElementById('app');
  if(phase==='intro')app.innerHTML=renderIntro();
  else if(phase==='quiz')app.innerHTML=renderQuiz();
  else app.innerHTML=renderResults();
  window.scrollTo(0,0);
}
function startQuiz(){phase='quiz';qIdx=0;render();}
function goBack(){if(qIdx>0){qIdx--;render();}}
function goNext(){
  if(answers[qIdx].length===0)return;
  if(qIdx+1>=QUESTIONS.length){results=computeResults(answers);phase='results';}
  else qIdx++;
  render();
}
function toggleOpt(i){
  const q=QUESTIONS[qIdx];const sel=answers[qIdx];const isMulti=q.type==='multi';
  if(!isMulti){answers[qIdx]=sel.includes(i)?[]:[i];}
  else{if(sel.includes(i))answers[qIdx]=sel.filter(x=>x!==i);else if(sel.length<(q.max||99))answers[qIdx]=[...sel,i];}
  render();
}
function toggleCard(rank){openCard=openCard===rank?-1:rank;render();}
function restart(){phase='intro';qIdx=0;openCard=0;answers=Array.from({length:QUESTIONS.length},()=>[]);results=null;render();}
render();
</script>
</body>
</html>
