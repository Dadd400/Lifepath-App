<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>College Decision Quiz · LifePath</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FAFAF7;--surface:#F2F0EB;--card:#FFFFFF;--border:#E0DDD6;
  --ink:#1C1C1C;--inkM:#6B6560;--inkD:#B8B4AC;--inkDim:#d0ccc4;
  --accent:#1C3D6B;--accentL:#2E5FA3;--accentBg:rgba(28,61,107,0.06);
  --gold:#C4873A;--goldBg:rgba(196,135,58,0.08);
  --green:#2A7A52;--greenBg:rgba(42,122,82,0.08);
  --coral:#C44A3A;
  --ff:'DM Serif Display',Georgia,serif;
  --sans:'Plus Jakarta Sans',sans-serif;
  --mono:'Fira Code',monospace;
}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:10px}
.nav-logo{font-family:var(--ff);font-size:18px;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:8px}
.nav-back{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--accentL);text-decoration:none;letter-spacing:0.05em}
.intro{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:80px 0 60px}
.intro-eye{font-size:10px;font-family:var(--mono);color:var(--accentL);letter-spacing:0.3em;margin-bottom:20px;text-transform:uppercase}
.intro-h{font-family:var(--ff);font-size:clamp(44px,9vw,72px);font-weight:400;color:var(--ink);margin-bottom:6px;line-height:1.05;letter-spacing:-0.025em}
.intro-bar{width:60px;height:3px;background:var(--accent);border-radius:2px;margin:20px 0 24px}
.intro-p{font-size:17px;color:var(--inkM);line-height:1.8;max-width:460px;margin-bottom:28px}
.pathway-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:36px;max-width:440px}
.pathway-chip{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.pathway-icon{font-size:18px}
.pathway-name{font-size:12px;font-family:var(--mono);color:var(--accentL);font-weight:700}
.btn-start{background:var(--ink);color:#fff;border:none;padding:15px 36px;border-radius:30px;font-size:14px;font-family:var(--mono);font-weight:700;cursor:pointer;letter-spacing:0.06em}
.intro-note{margin-top:14px;font-size:11px;color:var(--inkD);font-family:var(--mono)}
.intro-note span{color:var(--gold)}
.progress-wrap{margin-bottom:28px}
.progress-meta{display:flex;justify-content:space-between;margin-bottom:8px}
.progress-cat{font-size:10px;font-family:var(--mono);color:var(--inkM);letter-spacing:0.2em;text-transform:uppercase}
.progress-num{font-size:10px;font-family:var(--mono);color:var(--inkD)}
.progress-bar{display:flex;gap:3px}
.progress-seg{height:3px;border-radius:2px;background:var(--border);transition:all 0.3s}
.progress-seg.done{background:var(--accent)}
.progress-seg.active{flex:3;background:var(--accent)}
.quiz-wrap{padding-top:80px;padding-bottom:120px}
.q-meta{display:flex;justify-content:space-between;margin-bottom:12px}
.q-cat{font-size:10px;font-family:var(--mono);color:var(--inkM);letter-spacing:0.2em;text-transform:uppercase}
.q-num{font-size:10px;font-family:var(--mono);color:var(--inkD)}
.q-text{font-family:var(--ff);font-size:clamp(20px,4vw,28px);font-weight:400;color:var(--ink);margin-bottom:6px;line-height:1.3;letter-spacing:-0.015em}
.q-instr{font-size:11px;color:var(--inkD);font-family:var(--mono);margin-bottom:20px;letter-spacing:0.05em}
.q-sel{color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:28px}
.opt{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:13px 16px;cursor:pointer;text-align:left;width:100%;transition:all 0.15s;font-family:var(--sans)}
.opt:hover{border-color:var(--ink)}
.opt.selected{background:var(--accentBg);border-color:var(--accent)}
.opt-icon{font-size:20px;width:26px;text-align:center;flex-shrink:0}
.opt-label{font-size:14px;color:var(--ink);flex:1;line-height:1.4;font-weight:400}
.opt.selected .opt-label{color:var(--accentL);font-weight:500}
.opt-check{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;transition:all 0.15s}
.opt-check.multi{border-radius:4px}
.opt.selected .opt-check{background:var(--accent);border-color:var(--accent)}
.opt.disabled{opacity:0.35;cursor:not-allowed}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(250,250,247,0.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:14px 20px 24px;display:flex;justify-content:space-between;align-items:center;z-index:50}
.btn-back{background:none;border:1px solid var(--border);color:var(--inkM);font-family:var(--mono);font-size:12px;cursor:pointer;padding:9px 18px;border-radius:20px}
.btn-back.hidden{opacity:0;pointer-events:none}
.nav-sel{font-size:11px;color:var(--inkD);font-family:var(--mono)}
.btn-next{background:var(--ink);border:none;color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;font-family:var(--mono);font-weight:700;cursor:pointer;letter-spacing:0.06em;transition:all 0.15s}
.btn-next.disabled{background:var(--border);color:var(--inkD);cursor:default}
.gate-wrap{padding:40px 0}
.gate-eye{font-size:36px;text-align:center;margin-bottom:16px}
.gate-h{font-family:var(--ff);font-size:clamp(24px,5vw,36px);font-weight:400;color:var(--ink);margin-bottom:12px;letter-spacing:-0.02em;text-align:center}
.gate-p{font-size:15px;color:var(--inkM);line-height:1.7;max-width:420px;margin:0 auto 32px;text-align:center}
.gate-card{background:linear-gradient(135deg,#F5F0E8,#EDE8DC);border:1.5px solid rgba(196,135,58,0.3);border-radius:16px;padding:24px;margin-bottom:20px}
.gate-card-eye{font-size:10px;font-family:var(--mono);color:var(--gold);letter-spacing:0.2em;margin-bottom:8px;text-transform:uppercase}
.gate-card-title{font-size:16px;font-weight:600;color:var(--ink);margin-bottom:14px}
.gate-feat{display:flex;gap:10px;margin-bottom:8px;align-items:center;font-size:13px;color:var(--inkM)}
.gate-feat-check{color:var(--gold);font-size:12px;flex-shrink:0}
.btn-upgrade{width:100%;margin-top:16px;background:var(--gold);border:none;color:#fff;padding:14px;border-radius:10px;font-size:14px;font-family:var(--mono);font-weight:700;cursor:pointer;letter-spacing:0.06em}
.btn-free-results{width:100%;background:transparent;border:1.5px solid var(--border);color:var(--inkM);padding:13px;border-radius:10px;font-size:13px;font-family:var(--mono);cursor:pointer;letter-spacing:0.05em}
.results-wrap{padding-top:80px;padding-bottom:60px}
.results-eye{font-size:10px;font-family:var(--mono);color:var(--accentL);letter-spacing:0.25em;margin-bottom:12px;text-transform:uppercase}
.results-h{font-family:var(--ff);font-size:clamp(32px,6vw,52px);font-weight:400;color:var(--ink);margin-bottom:12px;letter-spacing:-0.025em;line-height:1}
.results-sub{font-size:14px;color:var(--inkM);line-height:1.7;margin-bottom:32px}
.r-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:12px;transition:all 0.2s}
.r-card.open{box-shadow:0 8px 32px rgba(0,0,0,0.06)}
.r-header{width:100%;background:none;border:none;cursor:pointer;padding:20px 24px;text-align:left;display:flex;align-items:center;gap:14px;font-family:var(--sans)}
.r-icon{width:50px;height:50px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px}
.r-info{flex:1}
.r-badges{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.r-badge{font-size:9px;font-family:var(--mono);font-weight:700;letter-spacing:0.12em;padding:2px 8px;border-radius:10px}
.r-title{font-size:17px;font-weight:600;color:var(--ink);font-family:var(--sans)}
.r-hl{font-size:12px;color:var(--inkM);font-family:var(--mono);margin-top:2px}
.r-score-wrap{text-align:right;flex-shrink:0}
.r-score{font-size:28px;font-weight:700;font-family:var(--mono);line-height:1}
.r-score-lbl{font-size:9px;color:var(--inkD);font-family:var(--mono)}
.r-toggle{color:var(--inkD);font-size:12px;margin-left:4px}
.r-body{padding:4px 24px 28px;border-top:1px solid var(--border)}
.r-summary{font-size:14px;color:var(--inkM);line-height:1.8;margin:18px 0 20px;border-left:3px solid;padding-left:14px}
.section-lbl{font-size:9px;font-family:var(--mono);letter-spacing:0.18em;color:var(--inkD);margin-bottom:10px;text-transform:uppercase}
.why-row{display:flex;gap:10px;margin-bottom:8px;align-items:flex-start}
.why-dot{font-size:10px;margin-top:3px;flex-shrink:0}
.why-text{font-size:13px;color:var(--inkM);line-height:1.5}
.entry-row{padding:12px 14px;border-radius:8px;margin-bottom:4px}
.entry-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.entry-title{font-size:14px;color:var(--ink);font-weight:500}
.entry-sal{font-size:12px;font-family:var(--mono);font-weight:700}
.entry-time{font-size:11px;color:var(--inkM);font-family:var(--mono);margin-top:3px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;margin-top:16px}
.info-box{background:var(--surface);border-radius:10px;padding:12px 14px}
.info-lbl{font-size:9px;font-family:var(--mono);letter-spacing:0.12em;color:var(--inkD);margin-bottom:5px;text-transform:uppercase}
.info-val{font-size:12px;color:var(--inkM);line-height:1.5}
.school-chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.school-chip{font-size:11px;font-family:var(--mono);padding:4px 10px;border-radius:16px}
.watch-box{border-radius:10px;padding:12px 16px}
.watch-kw{font-size:10px;font-family:var(--mono);font-weight:700;letter-spacing:0.12em}
.watch-txt{font-size:13px;color:var(--inkM);line-height:1.6}
.school-card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:8px;transition:all 0.2s}
.school-header{width:100%;background:none;border:none;cursor:pointer;padding:16px 20px;text-align:left;display:flex;align-items:center;gap:12px;font-family:var(--sans)}
.school-rank{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-family:var(--mono);font-weight:700;color:var(--accentL);background:var(--accentBg)}
.school-info{flex:1}
.school-name{font-size:15px;font-weight:600;color:var(--ink);font-family:var(--sans)}
.school-meta{font-size:11px;color:var(--inkM);font-family:var(--mono)}
.school-price{text-align:right;flex-shrink:0}
.school-net{font-size:13px;font-weight:700;color:var(--green);font-family:var(--mono)}
.school-net-lbl{font-size:9px;color:var(--inkD);font-family:var(--mono)}
.school-body{padding:4px 20px 20px;border-top:1px solid var(--border)}
.school-note{font-size:13px;color:var(--inkM);line-height:1.7;margin:12px 0;font-style:italic}
.school-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.stat-box{background:var(--surface);border-radius:8px;padding:10px 12px}
.stat-lbl{font-size:9px;font-family:var(--mono);color:var(--inkD);letter-spacing:0.1em;margin-bottom:3px;text-transform:uppercase}
.stat-val{font-size:12px;color:var(--ink);font-family:var(--mono);font-weight:700}
.strength-tags{display:flex;flex-wrap:wrap;gap:6px}
.strength-tag{font-size:11px;font-family:var(--mono);color:var(--accentL);border:1px solid rgba(28,61,107,0.2);padding:3px 10px;border-radius:12px}
.upgrade-cta{background:linear-gradient(135deg,#F5F0E8,#EDE8DC);border:1.5px solid rgba(196,135,58,0.3);border-radius:14px;padding:20px 22px;margin:8px 0 20px}
.upgrade-eye{font-size:10px;font-family:var(--mono);color:var(--gold);letter-spacing:0.18em;margin-bottom:8px;text-transform:uppercase}
.upgrade-txt{font-size:14px;color:var(--inkM);line-height:1.6;margin-bottom:14px}
.btn-upgrade-sm{background:var(--gold);border:none;color:#fff;padding:12px 24px;border-radius:10px;font-size:13px;font-family:var(--mono);font-weight:700;cursor:pointer;letter-spacing:0.06em}
.btn-retake{background:none;border:1px solid var(--border);color:var(--inkM);font-size:12px;font-family:var(--mono);cursor:pointer;padding:10px 24px;border-radius:20px;letter-spacing:0.08em;margin-top:8px}
</style>
</head>
<body>
<nav class="nav">
  <a class="nav-logo" href="/">✦ LifePath</a>
  <a class="nav-back" href="/">← Back</a>
</nav>
<div class="wrap" id="app"></div>
<script>
const FREE_QS=[
  {id:"situation",num:1,cat:"Where You Are",q:"What's your current situation?",type:"single",
   opts:[{l:"High school junior — planning ahead",i:"📚",t:["junior","planning"]},{l:"High school senior — deciding now",i:"⏰",t:["senior","urgent"]},{l:"Currently in college — considering transferring",i:"🔄",t:["transfer"]},{l:"Taking a gap year — deciding what's next",i:"🌍",t:["gap_year"]},{l:"Adult learner returning to school",i:"💼",t:["adult"]}]},
  {id:"goal",num:2,cat:"Your Why",q:"What's your primary goal after getting your degree?",type:"single",
   opts:[{l:"Land a specific high-paying job as fast as possible",i:"💰",t:["career_fast","roi"]},{l:"Build a career in a field I'm genuinely passionate about",i:"🔥",t:["passion"]},{l:"Start a business or work for myself eventually",i:"🚀",t:["entrepreneur"]},{l:"Go to grad or professional school (law, med, MBA)",i:"🎓",t:["grad_school","prestige"]},{l:"I'm not sure yet — I want to explore",i:"🧭",t:["explorer"]},{l:"Give back through public service or social impact",i:"🌍",t:["service"]}]},
  {id:"interest",num:3,cat:"Your Why",q:"What are you genuinely interested in studying?",type:"multi",max:3,
   opts:[{l:"STEM — science, tech, engineering, math",i:"🔬",t:["stem","high_demand"]},{l:"Business, finance, or entrepreneurship",i:"📊",t:["business","roi"]},{l:"Healthcare or pre-med",i:"🏥",t:["healthcare","grad_school"]},{l:"Arts, design, or media",i:"🎨",t:["arts","creative"]},{l:"Social sciences or humanities",i:"📖",t:["humanities","grad_school"]},{l:"Law, criminal justice, or policy",i:"⚖️",t:["law","grad_school"]},{l:"Education or social work",i:"🤝",t:["service"]},{l:"Trades, technical, or vocational",i:"🔧",t:["trade","no_debt"]},{l:"I have no idea yet",i:"🤷",t:["explorer","liberal_arts"]}]},
  {id:"finances",num:4,cat:"The Money",q:"What's your financial situation going into this decision?",type:"single",
   opts:[{l:"I need the most affordable option — debt is a real concern",i:"🟢",t:["budget_tight","no_debt","community_college"]},{l:"I have some aid but cost still matters a lot",i:"🟡",t:["budget_mid","in_state"]},{l:"Strong aid or family support — cost is less of a concern",i:"🟠",t:["budget_ok","prestige"]},{l:"Willing to take on debt if the school is worth it",i:"🔵",t:["debt_ok","prestige","roi"]},{l:"I want zero debt — work-first or trade routes interest me",i:"🔴",t:["no_debt","trade"]}]},
  {id:"experience",num:5,cat:"What You Want",q:"How important is the full college experience — campus life, social scene?",type:"single",
   opts:[{l:"Very important — I want the full experience",i:"🎉",t:["campus_life","large_school"]},{l:"Somewhat — I want balance of academics and social life",i:"⚖️",t:["balanced"]},{l:"Not that important — focused on degree and career",i:"🎯",t:["career_focused"]},{l:"Irrelevant — I just need the credential or skill",i:"📋",t:["credential_only","community_college","online"]}]},
  {id:"hbcu",num:6,cat:"What You Want",q:"How do you feel about HBCUs?",type:"single",
   opts:[{l:"It's a priority — I specifically want to attend an HBCU",i:"✊",t:["hbcu_strong"]},{l:"Very open to HBCUs — want to know more",i:"💡",t:["hbcu_open"]},{l:"I'd consider one if it's the best fit academically and financially",i:"🤔",t:["hbcu_consider"]},{l:"Not focused on HBCUs — other factors matter more",i:"➡️",t:["hbcu_neutral"]},{l:"Not sure what HBCUs offer — open to learning",i:"🔍",t:["hbcu_curious"]}]},
  {id:"reputation",num:7,cat:"What You Want",q:"How important is the school's name and reputation?",type:"single",
   opts:[{l:"Very important — I want a name that opens doors",i:"🏆",t:["prestige","grad_school"]},{l:"Somewhat — reputation matters but fit matters more",i:"📊",t:["balanced","fit"]},{l:"Not very important — I care about outcome not prestige",i:"🎯",t:["outcome_focused","roi"]},{l:"Completely irrelevant — going for skill and certification",i:"🔧",t:["trade","community_college"]}]},
  {id:"learning",num:8,cat:"How You Learn",q:"What kind of learning environment fits you best?",type:"multi",max:3,
   opts:[{l:"Small classes — professors know my name",i:"👥",t:["small_school","liberal_arts"]},{l:"Strong research and academic rigor",i:"🔬",t:["research","prestige"]},{l:"Hands-on, practical, project-based learning",i:"🛠️",t:["applied","trade","stem"]},{l:"Flexible or online options — fits around my schedule",i:"💻",t:["online","flexible","adult"]},{l:"Strong internship and career placement programs",i:"💼",t:["career_focused","roi"]},{l:"Competitive environment that pushes me hard",i:"⚡",t:["prestige","driven"]},{l:"Supportive and nurturing community",i:"🤝",t:["support","hbcu_open","small_school"]}]},
  {id:"concerns",num:9,cat:"Your Concerns",q:"What concerns you most about this decision?",type:"multi",max:3,
   opts:[{l:"Taking on too much student debt",i:"💸",t:["debt_concern","no_debt","community_college"]},{l:"Choosing the wrong major and wasting time or money",i:"🔀",t:["explorer","liberal_arts"]},{l:"Not getting into the schools I want",i:"📉",t:["realistic"]},{l:"Feeling out of place or not belonging",i:"🫂",t:["belonging","hbcu_open","small_school"]},{l:"Not being prepared for college-level work",i:"📚",t:["support","community_college"]},{l:"Wasting time in college when I could be earning",i:"⏱️",t:["trade","roi"]},{l:"Making a decision that disappoints people close to me",i:"❤️",t:["pressure"]},{l:"AI and automation making my degree less valuable",i:"🤖",t:["stem","trade"]}]},
  {id:"timeline",num:10,cat:"Your Path",q:"How quickly do you want to be earning a real income?",type:"single",
   opts:[{l:"ASAP — I want income within 1–2 years",i:"⚡",t:["trade","community_college","fast_track"]},{l:"2–3 years — open to associate degree or transfer path",i:"📅",t:["community_college","transfer"]},{l:"4 years — standard bachelor's degree timeline",i:"🎓",t:["four_year"]},{l:"5+ years — investing in a longer path (grad school, med, law)",i:"🏛️",t:["grad_school","prestige","long_term"]},{l:"Flexible — I'll take as long as the right path requires",i:"🌊",t:["flexible"]}]}
];

const PREMIUM_QS=[
  {id:"gpa",num:11,cat:"Your Profile",q:"What's your honest GPA right now?",type:"single",
   opts:[{l:"3.7 or above — strong academic record",i:"⭐",t:["gpa_high"]},{l:"3.0–3.6 — solid, competitive for most schools",i:"✅",t:["gpa_mid"]},{l:"2.5–2.9 — need to be strategic about options",i:"📊",t:["gpa_low"]},{l:"Below 2.5 — need schools that look beyond GPA",i:"🔄",t:["gpa_rebuild"]},{l:"Non-traditional — GPA isn't my full story",i:"💪",t:["non_trad"]}]},
  {id:"test",num:12,cat:"Your Profile",q:"What's your SAT or ACT score situation?",type:"single",
   opts:[{l:"1400+ SAT / 31+ ACT — strong scores",i:"🏆",t:["test_high"]},{l:"1200–1399 SAT / 26–30 ACT — solid scores",i:"✅",t:["test_mid"]},{l:"1000–1199 SAT / 20–25 ACT — average range",i:"📊",t:["test_avg"]},{l:"Below 1000 SAT / below 20 ACT",i:"📈",t:["test_low"]},{l:"Haven't taken it yet or going test-optional",i:"🔓",t:["test_opt"]}]},
  {id:"region",num:13,cat:"Your Profile",q:"What region of the US are you in?",type:"single",

function scorePathways(allAnswers,allQs){
  const tagCounts={};
  allAnswers.forEach((sel,qi)=>{
    const q=allQs[qi];if(!q)return;
    sel.forEach(oi=>{(q.opts[oi]?.t||[]).forEach(tag=>{tagCounts[tag]=(tagCounts[tag]||0)+1;});});
  });
  return PATHWAYS.map(p=>{
    let s=0;
    p.tags.forEach(tag=>{s+=(tagCounts[tag]||0)*2;});
    const max=p.tags.length*2*3;
    const pct=Math.min(Math.max(Math.round((s/max)*100),22),97);
    return{...p,score:pct};
  }).sort((a,b)=>b.score-a.score);
}

function scoreSchools(allAnswers){
  const allTags=[];
  const allQs=[...FREE_QS,...PREMIUM_QS];
  allAnswers.forEach((sel,qi)=>{
    const q=allQs[qi];if(!q)return;
    sel.forEach(oi=>{allTags.push(...(q.opts[oi]?.t||[]));});
  });
  const tagCounts={};
  allTags.forEach(t=>{tagCounts[t]=(tagCounts[t]||0)+1;});
  return SCHOOL_DB.map(school=>{
    let s=0;
    school.tags.forEach(tag=>{s+=(tagCounts[tag]||0)*3;});
    return{...school,score:s};
  }).sort((a,b)=>b.score-a.score).slice(0,8);
}

    </button>
    ${isOpen?`<div class="school-body">
      <p class="school-note">${school.note}</p>
      <div class="school-stats">
        <div class="stat-box"><div class="stat-lbl">Sticker Price</div><div class="stat-val">${school.tuition}</div></div>
        <div class="stat-box"><div class="stat-lbl">Acceptance</div><div class="stat-val">${school.accept}</div></div>
        <div class="stat-box"><div class="stat-lbl">Net Price</div><div class="stat-val">${school.net}</div></div>
      </div>
      <div class="section-lbl">Top Strengths</div>
      <div class="strength-tags">${school.strengths.map(s=>`<span class="strength-tag">${s}</span>`).join('')}</div>
    </div>`:''}
  </div>`;
}

function renderFreeResults(){
  return`<div class="results-wrap">
    <div class="results-eye">YOUR PATHWAY</div>
    <h2 class="results-h">Your college paths.</h2>
    <p class="results-sub">Based on your goals, finances, and priorities. Tap each to see the full breakdown.</p>
    ${pathways.slice(0,4).map((p,i)=>renderPathwayCard(p,i)).join('')}
    <div class="upgrade-cta">
      <div class="upgrade-eye">✦ WANT SPECIFIC SCHOOLS?</div>
      <p class="upgrade-txt">Answer 5 more questions to get up to 8 real school recommendations with net price after aid, acceptance rates, and how well each matches your profile.</p>
      <button class="btn-upgrade-sm" onclick="startPremium()">GET SCHOOL RECOMMENDATIONS →</button>
    </div>
    <button class="btn-retake" onclick="restart()">↩ Retake Quiz</button>
  </div>`;
}

function renderPremResults(){
  return`<div class="results-wrap">
    <div class="results-eye">✦ PREMIUM RESULTS</div>
    <h2 class="results-h">Your schools and pathways.</h2>
    <p class="results-sub">Matched to your GPA, region, finances, and goals. Net price shown is the average after financial aid — not the sticker price.</p>
    <div class="section-lbl" style="margin-bottom:14px">✦ YOUR SCHOOL MATCHES</div>
    ${schools.map((s,i)=>renderSchoolCard(s,i)).join('')}
    <div style="margin-top:24px;margin-bottom:14px"><div class="section-lbl">YOUR PATHWAY MATCHES</div></div>
    ${pathways.slice(0,3).map((p,i)=>renderPathwayCard(p,i)).join('')}
    <button class="btn-retake" onclick="restart()">↩ Retake Quiz</button>
  </div>`;
}

function render(){
  const app=document.getElementById('app');
  if(phase==='intro')app.innerHTML=renderIntro();
  else if(phase==='free_quiz'||phase==='prem_quiz')app.innerHTML=renderQuiz();
  else if(phase==='gate')app.innerHTML=renderGate();
  else if(phase==='free_results')app.innerHTML=renderFreeResults();
  else if(phase==='prem_results')app.innerHTML=renderPremResults();
  window.scrollTo(0,0);
}

function startFree(){phase='free_quiz';qIdx=0;render();}
function startPremium(){phase='prem_quiz';qIdx=0;render();}
function viewFree(){phase='free_results';render();}

function goBack(){
  if(phase==='free_quiz'&&qIdx>0){qIdx--;render();}
  else if(phase==='prem_quiz'&&qIdx>0){qIdx--;render();}
  else if(phase==='prem_quiz'&&qIdx===0){phase='gate';render();}
}

function goNext(){
  const sel=currentSel();if(sel.length===0)return;
  if(phase==='free_quiz'){
    if(qIdx+1>=FREE_LEN){
      pathways=scorePathways(freeAnswers,FREE_QS);
      phase='gate';
    } else qIdx++;
  } else {
    if(qIdx+1>=PREM_LEN){
      const allAns=[...freeAnswers,...premAnswers];
      pathways=scorePathways(allAns,[...FREE_QS,...PREMIUM_QS]);
      schools=scoreSchools(allAns);
      phase='prem_results';
    } else qIdx++;
  }
  render();
}

function toggleOpt(i){
  const q=currentQ();
  const arr=isPrem()?premAnswers:freeAnswers;
  const sel=arr[qIdx];const isMulti=q.type==='multi';
  if(!isMulti){arr[qIdx]=sel.includes(i)?[]:[i];}
  else{if(sel.includes(i))arr[qIdx]=sel.filter(x=>x!==i);else if(sel.length<(q.max||99))arr[qIdx]=[...sel,i];}
  render();
}

function toggleCard(rank){openCard=openCard===rank?-1:rank;render();}
function toggleSchool(rank){openSchool=openSchool===rank?-1:rank;render();}

function restart(){
  phase='intro';qIdx=0;openCard=0;openSchool=0;
  freeAnswers=Array.from({length:FREE_LEN},()=>[]);
  premAnswers=Array.from({length:PREM_LEN},()=>[]);
  pathways=null;schools=null;
  render();
}

render();
</script>
</body>
</html>
